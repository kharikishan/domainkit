models:
  - name: Payment
    fields:
      - name: id
        type: string
        required: true
        description: Unique payment identifier
      - name: amount
        type: number
        required: true
        description: Payment amount in cents
      - name: currency
        type: string
        required: true
        description: ISO 4217 currency code
      - name: status
        type: string
        required: true
        description: Payment status (pending, completed, failed, refunded)
  - name: Refund
    fields:
      - name: id
        type: string
        required: true
        description: Unique refund identifier
      - name: paymentId
        type: string
        required: true
        description: Reference to the original payment
      - name: amount
        type: number
        required: true
        description: Refund amount in cents

api:
  routes:
    - method: POST
      path: /payments
      description: Initiate a new payment
    - method: GET
      path: /payments/:id
      description: Retrieve payment details by ID
    - method: POST
      path: /payments/:id/refund
      description: Issue a refund for a completed payment

events:
  - name: payment.completed
    payload: Payment
    description: Fired when a payment is successfully processed
  - name: payment.failed
    payload: Payment
    description: Fired when a payment fails
  - name: payment.refunded
    payload: Refund
    description: Fired when a refund is issued

dependencies:
  - user-auth
  - notifications
